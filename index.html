<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 열심히 공부</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .main-container {
            display: flex;
            background: #161b22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            gap: 20px;
            width: 100%;
            max-width: 850px;
            border: 1px solid #30363d;
        }
        /* 왼쪽 패널 (영상 및 육성 상태) */
        .left-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            position: relative;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .mode-badge {
            background: #2ea043;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .mode-badge.break {
            background: #bb8009;
        }
        .sub-text {
            color: #8b949e;
            font-size: 11px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        video.active {
            opacity: 1;
        }
        .status-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .status-quote {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #30363d;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: #2ea043;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #c9d1d9;
        }

        /* 오른쪽 패널 (타이머 컨트롤) */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .panel-title h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f0f6fc;
        }
        .panel-title p {
            color: #8b949e;
            font-size: 12px;
        }
        /* (255, 0, 255) 색상의 ASMR 버튼 디자인 */
        .asmr-btn {
            background-color: rgb(255, 0, 255);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 0, 255, 0.4);
            transition: opacity 0.2s;
        }
        .asmr-btn:hover {
            opacity: 0.85;
        }

        .timer-card {
            background: #21262d;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid #30363d;
            margin: 15px 0;
        }
        .timer-mode-label {
            color: #2ea043;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        #display {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .timer-sub {
            color: #8b949e;
            font-size: 11px;
        }
        .preset-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .preset-buttons button {
            flex: 1;
            padding: 8px 0;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-buttons button:hover {
            background: #30363d;
            color: #fff;
        }
        .custom-input-box {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        .custom-input-box input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            color: white;
            font-size: 13px;
            text-align: center;
            outline: none;
        }
        .custom-input-box button {
            padding: 0 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-start {
            background: #2ea043;
            color: white;
        }
        .btn-stop {
            background: #da3633;
            color: white;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            .video-box {
                height: 200px;
            }
            #display {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 왼쪽 영역: 영상 및 캐릭터 상태 -->
    <div class="left-panel">
        <div class="video-card">
            <div class="video-header">
                <span id="modeBadge" class="mode-badge">집중 공부 모드</span>
                <span id="sourceInfo" class="sub-text">난수 재생 중</span>
            </div>
            <div class="video-box">
                <video id="vid1" autoplay muted playsinline class="active"></video>
                <video id="vid2" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="status-card">
            <div class="status-quote">"열심히 집중하면 캐릭터가 성장해요!"</div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="status-footer">
                <span id="totalStudyText">누적 공부: 0분</span>
                <span id="levelText">성장 단계: Lv.1 연습생</span>
            </div>
        </div>
    </div>

    <!-- 오른쪽 영역: 타이머 컨트롤 -->
    <div class="right-panel">
        <div>
            <div class="panel-top-header">
                <div class="panel-title">
                    <h2>오늘도 열심히 공부</h2>
                    <p>타이머를 설정하고 캐릭터와 함께 공부하세요.</p>
                </div>
                <!-- ASMR 팝업 버튼 -->
                <button class="asmr-btn" onclick="openAsmrPopup()">ASMR</button>
            </div>

            <div class="timer-card">
                <div id="timerModeLabel" class="timer-mode-label">집중 공부 모드</div>
                <div id="display">00:30:00</div>
                <div class="timer-sub">목표 시간을 향해 달려보세요!</div>
            </div>

            <div class="preset-buttons">
                <button onclick="setTimer(30, false)">30분 집중</button>
                <button onclick="setTimer(60, false)">1시간 집중</button>
                <button class="break-preset" onclick="setTimer(10, true)">10분 휴식</button>
            </div>

            <div class="custom-input-box">
                <input type="number" id="customMinutes" placeholder="직접 입력 (분)" min="1">
                <button onclick="setCustomTimer()">설정</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-start" onclick="startTimer()">타이머 시작</button>
            <button class="btn-stop" onclick="stopTimer()">정지 / 초기화</button>
        </div>
    </div>
</div>

    let currentMode = 'study';

    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');

    let currentAsmrAudio = null;

    window.onload = () => {
        playNextRandomVideo('study');
        updateDisplay();
    };

    v1.addEventListener('ended', () => handleVideoEnd());
    v2.addEventListener('ended', () => handleVideoEnd());

        playNextRandomVideo(currentMode);
    }

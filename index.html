<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 열심히 공부</title>

    <meta property="og:title" content="오늘도 열심히 공부">
    <meta property="og:description" content="ASMR과 타이머로 집중력을 높이세요!">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .main-container {
            display: flex;
            background: #161b22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            gap: 20px;
            width: 100%;
            max-width: 850px;
            border: 1px solid #30363d;
            position: relative;
        }
        .left-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            position: relative;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .mode-badge {
            background: #2ea043;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .mode-badge.break {
            background: #bb8009;
        }
        .mode-badge.easteregg {
            background: rgb(255, 0, 255);
        }
        .sub-text {
            color: #8b949e;
            font-size: 11px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            opacity: 0;
            transition: opacity 0.15s ease-in-out; /* 전환 속도를 더 매끄럽게 단축 */
        }
        video.active {
            opacity: 1;
        }
        .status-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .status-quote {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #30363d;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: #2ea043;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #c9d1d9;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .panel-title h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f0f6fc;
        }
        .panel-title p {
            color: #8b949e;
            font-size: 12px;
        }
        .asmr-btn {
            background-color: rgb(255, 0, 255);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 0, 255, 0.4);
            transition: opacity 0.2s;
        }
        .asmr-btn:hover {
            opacity: 0.85;
        }
        .timer-card {
            background: #21262d;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid #30363d;
            margin: 15px 0;
        }
        .timer-mode-label {
            color: #2ea043;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        #display {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .timer-sub {
            color: #8b949e;
            font-size: 11px;
        }
        .preset-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .preset-buttons button {
            flex: 1;
            padding: 8px 0;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-buttons button:hover {
            background: #30363d;
            color: #fff;
        }
        .break-preset {
            color: #bb8009 !important;
        }
        .custom-input-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .custom-input-row {
            display: flex;
            gap: 6px;
        }
        .custom-input-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            color: white;
            font-size: 13px;
            text-align: center;
            outline: none;
        }
        .custom-input-row button {
            padding: 0 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkbox-label {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding-left: 2px;
        }
        .checkbox-label input {
            accent-color: #bb8009;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-start {
            background: #2ea043;
            color: white;
        }
        .btn-stop {
            background: #da3633;
            color: white;
        }

        /* ASMR 패널 오버레이 */
        .asmr-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .asmr-modal.active {
            display: flex;
        }
        .asmr-modal h3 {
            color: rgb(255, 0, 255);
            margin-bottom: 3px;
            font-size: 19px;
        }
        .asmr-modal p {
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: center;
        }
        .mixer-container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .sound-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #21262d;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .sound-info {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 130px;
        }
        .sound-info span {
            font-size: 12px;
            font-weight: bold;
            color: #c9d1d9;
        }
        .toggle-btn {
            background: #30363d;
            color: #8b949e;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-btn.active {
            background: #2ea043;
            color: white;
        }
        input[type=range] {
            flex: 1;
            margin-left: 10px;
            height: 6px;
            accent-color: #2ea043;
            cursor: pointer;
        }
        .asmr-bottom-btns {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 420px;
        }
        .asmr-close-btn {
            background: #2ea043;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }
        .asmr-all-stop {
            background: #da3633;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            .video-box {
                height: 200px;
            }
            #display {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- ASMR 패널 오버레이 -->
    <div id="asmrModal" class="asmr-modal">
        <h3>🎧 ASMR 사운드 믹서</h3>
        <p>백그라운드에서 계속 재생됩니다.</p>
        <div class="mixer-container" id="mixerBox"></div>
        <div class="asmr-bottom-btns">
            <button class="asmr-all-stop" onclick="stopAllSounds()">모든 소리 끄기</button>
            <button class="asmr-close-btn" onclick="toggleAsmrPanel()">닫기</button>
        </div>
    </div>

    <!-- 왼쪽 영역: 영상 및 캐릭터 상태 -->
    <div class="left-panel">
        <div class="video-card">
            <div class="video-header">
                <span id="modeBadge" class="mode-badge">집중 공부 모드</span>
                <span id="sourceInfo" class="source-info">재생 중</span>
            </div>
            <div class="video-box">
                <video id="vid1" autoplay playsinline></video>
                <video id="vid2" autoplay playsinline></video>
            </div>
        </div>

        <div class="status-card">
            <div class="status-quote">"캐릭터가 성장해요!"</div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="status-footer">
                <span id="totalStudyText">누적: 0분</span>
                <span id="levelText">Lv.1 연습생</span>
            </div>
        </div>
    </div>

    <!-- 오른쪽 영역: 타이머 컨트롤 -->
    <div class="right-panel">
        <div>
            <div class="panel-top-header">
                <div class="panel-title">
                    <h2>오늘도 열심히 공부</h2>
                    <p>타이머와 함께 하세요.</p>
                </div>
                <button class="asmr-btn" onclick="toggleAsmrPanel()">ASMR</button>
            </div>

            <div class="timer-card">
                <div id="timerModeLabel" class="timer-mode-label">집중 공부 모드</div>
                <div id="display">00:30:00</div>
                <div class="timer-sub">목표를 향해 달려보세요!</div>
            </div>

            <div class="preset-buttons">
                <button onclick="setTimer(30, false)">30분 집중</button>
                <button onclick="setTimer(60, false)">1시간 집중</button>
                <button class="break-preset" onclick="setTimer(10, true)">10분 휴식</button>
            </div>

            <div class="custom-input-box">
                <div class="custom-input-row">
                    <input type="text" id="customMinutes" placeholder="직접 입력 (분)" autocomplete="off">
                    <button onclick="setCustomTimer()">설정</button>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="breakModeCheckbox"> 휴식 시간으로 설정하기
                </label>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-start" onclick="startTimer()">시작</button>
            <button class="btn-stop" onclick="stopTimer()">초기화</button>
        </div>
    </div>
</div>

<script>
    const studyVideos = ['study_1.mp4', 'study_2.mp4'];
    
    let totalSeconds = 30 * 60;
    let timerInterval = null;
    let isBreakTime = false;
    let isEasterEggMode = false;
    let accumulatedStudySeconds = 0;

    let breakVideoStage = 0; // 0: 평상시, 1: study_3 재생 중, 2: study_4 반복 중, 3: study_5 임박 재생 중

    let activeVidIndex = 1;
    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');

    window.onload = () => {
        playRandomStudyVideo();
        updateDisplay();
        initAsmrMixer();
    };

    v1.addEventListener('ended', handleVideoEnd);
    v2.addEventListener('ended', handleVideoEnd);

    // 비디오가 끝나기 직전(약 0.3초 전) 미리 다음 영상을 준비시키는 이벤트 (타이밍 겹침/깜빡임 원천 차단)
    v1.addEventListener('timeupdate', checkVideoPreload);
    v2.addEventListener('timeupdate', checkVideoPreload);

    function checkVideoPreload(e) {
        const vid = e.target;
        // 남은 시간이 0.3초 미만이고, 휴식 모드에서 stage 1(study_3) 재생 중일 때 미리 study_4 로드
        if (isBreakTime && breakVideoStage === 1 && vid.duration - vid.currentTime < 0.3 && !vid._preloadTriggered) {
            vid._preloadTriggered = true;
            preloadNextVideo('study_4.mp4', true, true);
        }
    }

    function preloadNextVideo(filename, loop, muted) {
        let nextVid = (activeVidIndex === 1) ? v2 : v1;
        if (nextVid.src.indexOf(filename) === -1) {
            nextVid.loop = loop;
            nextVid.muted = muted;
            nextVid.src = filename;
            nextVid.load();
        }
    }

    function handleVideoEnd() {
        if (isEasterEggMode) return;

        if (!isBreakTime) {
            playRandomStudyVideo();
        } else {
            if (breakVideoStage === 1) {
                breakVideoStage = 2;
                playPreloadedVideo('study_4.mp4', true, true);
                document.getElementById('sourceInfo').innerText = "휴식 영상 (반복)";
            } else if (breakVideoStage === 2) {
                playPreloadedVideo('study_4.mp4', true, true);
            }
        }
    }

    function playPreloadedVideo(filename, loop, muted) {
        let currentVid = (activeVidIndex === 1) ? v1 : v2;
        let nextVid = (activeVidIndex === 1) ? v2 : v1;

        nextVid.loop = loop;
        nextVid.muted = muted;
        if (nextVid.src.indexOf(filename) === -1) {
            nextVid.src = filename;
            nextVid.load();
        }

        nextVid.play().then(() => {
            nextVid.classList.add('active');
            currentVid.classList.remove('active');
            currentVid.pause();
            currentVid.currentTime = 0;
            activeVidIndex = (activeVidIndex === 1) ? 2 : 1;
        }).catch(e => {
            console.log("재생 대기중:", e);
        });
    }

    function playRandomStudyVideo() {
        if (isEasterEggMode) return;
        playSpecificVideo(studyVideos[Math.floor(Math.random() * studyVideos.length)], false, true);
    }

    function playSpecificVideo(filename, loop, muted) {
        let currentVid = (activeVidIndex === 1) ? v1 : v2;
        let nextVid = (activeVidIndex === 1) ? v2 : v1;

        currentVid.pause();
        currentVid.currentTime = 0;
        currentVid.muted = true;

        nextVid.loop = loop;
        nextVid.muted = muted;
        nextVid.src = filename;
        nextVid.load();
        
        nextVid.play().then(() => {
            nextVid.classList.add('active');
            currentVid.classList.remove('active');
            activeVidIndex = (activeVidIndex === 1) ? 2 : 1;
        }).catch(e => {
            console.log("자동재생 대기중:", e);
        });
    }

    function updateDisplay() {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('display').innerText = `${hours}:${minutes}:${seconds}`;
    }

    function setCustomTimer() {
        const inputElem = document.getElementById('customMinutes');
        const checkboxElem = document.getElementById('breakModeCheckbox');
        
        if (!inputElem || !checkboxElem) return;

        const inputVal = inputElem.value.trim();
        const isBreakChecked = checkboxElem.checked;

        if (isBreakChecked && inputVal === '120') {
            if (window.confirm("너 정말 이만큼 쉴꺼야?")) {
                triggerEasterEgg('video_0824.mp4', 120, "120 시크릿 휴식");
            }
            return;
        }

        if (isBreakChecked && inputVal === '60') {
            triggerEasterEgg('video_60.mp4', 60, "60분 시크릿 휴식");
            return;
        }

        const mins = parseInt(inputVal);
        if (isNaN(mins) || mins <= 0) {
            alert("올바른 분(Minute)을 입력하세요.");
            return;
        }
        setTimer(mins, isBreakChecked);
    }

    function setTimer(minutes, breakMode) {
        stopTimer();
        isEasterEggMode = false;
        totalSeconds = minutes * 60;
        isBreakTime = breakMode;
        breakVideoStage = 0;

        v1._preloadTriggered = false;
        v2._preloadTriggered = false;

        const badge = document.getElementById('modeBadge');
        const timerLabel = document.getElementById('timerModeLabel');

        if (isBreakTime) {
            badge.innerText = "휴식 시간 모드";
            badge.className = "mode-badge break";
            timerLabel.innerText = "휴식 시간";
            timerLabel.style.color = "#bb8009";
            
            breakVideoStage = 1;
            playSpecificVideo('study_3.mp4', false, true);
            document.getElementById('sourceInfo').innerText = "휴식 영상 (시작)";
        } else {
            badge.innerText = "집중 공부 모드";
            badge.className = "mode-badge";
            timerLabel.innerText = "집중 공부 모드";
            timerLabel.style.color = "#2ea043";
            playRandomStudyVideo();
        }
        updateDisplay();
    }

    function triggerEasterEgg(videoFilename, durationMins, labelText) {
        stopTimer();
        isEasterEggMode = true;
        isBreakTime = true;
        totalSeconds = durationMins * 60;

        stopAllSounds();

        const badge = document.getElementById('modeBadge');
        const timerLabel = document.getElementById('timerModeLabel');

        badge.innerText = "시크릿 휴식 모드";
        badge.className = "mode-badge easteregg";
        timerLabel.innerText = labelText;
        timerLabel.style.color = "rgb(255, 0, 255)";

        playSpecificVideo(videoFilename, false, false);
        document.getElementById('sourceInfo').innerText = "시크릿 영상 재생 중";
        updateDisplay();
    }

    function startTimer() {
        if (timerInterval || totalSeconds <= 0) return;
        
        if (isBreakTime && !isEasterEggMode && breakVideoStage === 0) {
            breakVideoStage = 1;
            playSpecificVideo('study_3.mp4', false, true);
            document.getElementById('sourceInfo').innerText = "휴식 영상 (시작)";
        }

        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();

                if (isBreakTime && !isEasterEggMode && totalSeconds === 2 && breakVideoStage < 3) {
                    breakVideoStage = 3;
                    playSpecificVideo('study_5.mp4', false, true);
                    document.getElementById('sourceInfo').innerText = "휴식 임박 (2초 전)";
                }

                if (!isBreakTime) {
                    accumulatedStudySeconds++;
                    updateCharacterProgress();
                }
            } else {
                stopTimer();
                
                if (isBreakTime) {
                    alert("휴식 시간이 종료되었습니다! 집중 공부 모드로 전환합니다.");
                    setTimer(30, false);
                    startTimer();
                } else {
                    alert("공부 시간이 종료되었습니다! 수고하셨습니다.");
                }
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function updateCharacterProgress() {
        const totalMinutes = Math.floor(accumulatedStudySeconds / 60);
        document.getElementById('totalStudyText').innerText = `누적: ${totalMinutes}분`;

        const progressPercent = Math.min((totalMinutes % 60) / 60 * 100, 100);
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        let level = Math.floor(totalMinutes / 60) + 1;
        document.getElementById('levelText').innerText = `Lv.${level} 수련생`;
    }

    /* ASMR 10가지 트랙 (왁뿌볼 포함) */
    const soundTracks = [
        { id: 'birds', name: '새소리 🐦', file: 'birds.mp3' },
        { id: 'crickets', name: '귀뚜라미 🦗', file: 'crickets.mp3' },
        { id: 'fire', name: '모닥불 🪵', file: 'fire.mp3' },
        { id: 'keyboard', name: '키보드 ⌨️', file: 'keyboard.mp3' },
        { id: 'rain', name: '비 🌧️', file: 'rain.mp3' },
        { id: 'singingbowl', name: '싱잉볼 🔔', file: 'singingbowl.mp3' },
        { id: 'thunder', name: '천둥 ⚡', file: 'thunder.mp3' },
        { id: 'waves', name: '파도 🌊', file: 'waves.mp3' },
        { id: 'wind', name: '바람 🌬️', file: 'wind.mp3' },
        { id: 'wax', name: '왁뿌볼 🔮', file: 'wax.mp3' }
    ];

    const audioElements = {};

    function initAsmrMixer() {
        const mixerBox = document.getElementById('mixerBox');
        if (!mixerBox) return;
        mixerBox.innerHTML = "";
        
        soundTracks.forEach(track => {
            const audio = new Audio(track.file);
            audio.loop = true;
            audio.volume = 0.5;
            audioElements[track.id] = audio;

            const row = document.createElement('div');
            row.className = 'sound-row';
            row.innerHTML = `
                <div class="sound-info">
                    <button class="toggle-btn" id="btn-${track.id}" onclick="toggleSound('${track.id}')">OFF</button>
                    <span>${track.name}</span>
                </div>
                <input type="range" id="vol-${track.id}" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume('${track.id}', this.value)">
            `;
            mixerBox.appendChild(row);
        });
    }

    function toggleAsmrPanel() {
        const modal = document.getElementById('asmrModal');
        if (modal) modal.classList.toggle('active');
    }

    function toggleSound(id) {
        const audio = audioElements[id];
        const btn = document.getElementById('btn-' + id);
        if (!audio || !btn) return;

        if (audio.paused) {
            audio.play().then(() => {
                btn.classList.add('active');
                btn.innerText = 'ON';
            }).catch(e => {
                alert("음원 파일을 찾을 수 없거나 재생이 차단되었습니다.");
            });
        } else {
            audio.pause();
            btn.classList.remove('active');
            btn.innerText = 'OFF';
        }
    }

    function changeVolume(id, val) {
        if (audioElements[id]) {
            audioElements[id].volume = val;
        }
    }

    function stopAllSounds() {
        soundTracks.forEach(track => {
            const audio = audioElements[track.id];
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            const btn = document.getElementById('btn-' + track.id);
            if(btn) {
                btn.classList.remove('active');
                btn.innerText = 'OFF';
            }
        });
    }
</script>

</body>
</html>

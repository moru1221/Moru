<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 열심히 공부</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .main-container {
            display: flex;
            background: #161b22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            gap: 20px;
            width: 100%;
            max-width: 850px;
            border: 1px solid #30363d;
        }
        /* 왼쪽 패널 (영상 및 육성 상태) */
        .left-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            position: relative;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .mode-badge {
            background: #2ea043;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .mode-badge.break {
            background: #bb8009;
        }
        .sub-text {
            color: #8b949e;
            font-size: 11px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        video.active {
            opacity: 1;
        }
        .status-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .status-quote {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #30363d;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: #2ea043;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #c9d1d9;
        }

        /* 오른쪽 패널 (타이머 컨트롤) */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .panel-title h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f0f6fc;
        }
        .panel-title p {
            color: #8b949e;
            font-size: 12px;
        }
        /* (255, 0, 255) 색상의 ASMR 버튼 디자인 */
        .asmr-btn {
            background-color: rgb(255, 0, 255);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 0, 255, 0.4);
            transition: opacity 0.2s;
        }
        .asmr-btn:hover {
            opacity: 0.85;
        }

        .timer-card {
            background: #21262d;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid #30363d;
            margin: 15px 0;
        }
        .timer-mode-label {
            color: #2ea043;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        #display {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .timer-sub {
            color: #8b949e;
            font-size: 11px;
        }
        .preset-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .preset-buttons button {
            flex: 1;
            padding: 8px 0;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-buttons button:hover {
            background: #30363d;
            color: #fff;
        }
        .custom-input-box {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        .custom-input-box input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            color: white;
            font-size: 13px;
            text-align: center;
            outline: none;
        }
        .custom-input-box button {
            padding: 0 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-start {
            background: #2ea043;
            color: white;
        }
        .btn-stop {
            background: #da3633;
            color: white;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            .video-box {
                height: 200px;
            }
            #display {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 왼쪽 영역: 영상 및 캐릭터 상태 -->
    <div class="left-panel">
        <div class="video-card">
            <div class="video-header">
                <span id="modeBadge" class="mode-badge">집중 공부 모드</span>
                <span id="sourceInfo" class="sub-text">난수 재생 중</span>
            </div>
            <div class="video-box">
                <video id="vid1" autoplay muted playsinline class="active"></video>
                <video id="vid2" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="status-card">
            <div class="status-quote">"열심히 집중하면 캐릭터가 성장해요!"</div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="status-footer">
                <span id="totalStudyText">누적 공부: 0분</span>
                <span id="levelText">성장 단계: Lv.1 연습생</span>
            </div>
        </div>
    </div>

    <!-- 오른쪽 영역: 타이머 컨트롤 -->
    <div class="right-panel">
        <div>
            <div class="panel-top-header">
                <div class="panel-title">
                    <h2>오늘도 열심히 공부</h2>
                    <p>타이머를 설정하고 캐릭터와 함께 공부하세요.</p>
                </div>
                <!-- ASMR 팝업 버튼 -->
                <button class="asmr-btn" onclick="openAsmrPopup()">ASMR</button>
            </div>

            <div class="timer-card">
                <div id="timerModeLabel" class="timer-mode-label">집중 공부 모드</div>
                <div id="display">00:30:00</div>
                <div class="timer-sub">목표 시간을 향해 달려보세요!</div>
            </div>

            <div class="preset-buttons">
                <button onclick="setTimer(30, false)">30분 집중</button>
                <button onclick="setTimer(60, false)">1시간 집중</button>
                <button class="break-preset" onclick="setTimer(10, true)">10분 휴식</button>
            </div>

            <div class="custom-input-box">
                <input type="number" id="customMinutes" placeholder="직접 입력 (분)" min="1">
                <button onclick="setCustomTimer()">설정</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-start" onclick="startTimer()">타이머 시작</button>
            <button class="btn-stop" onclick="stopTimer()">정지 / 초기화</button>
        </div>
    </div>
</div>

<script>
    const studyVideos = ['study_1.mp4', 'study_2.mp4'];
    const breakVideos = ['break_1.mp4'];

    let totalSeconds = 30 * 60;
    let timerInterval = null;
    let isBreakTime = false;
    let currentMode = 'study';
    let accumulatedStudySeconds = 0;

    let activeVidIndex = 1;
    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');

    // 팝업 창 객체를 저장할 변수
    let asmrWindow = null;

    window.onload = () => {
        playNextRandomVideo('study');
        updateDisplay();
    };

    v1.addEventListener('ended', () => handleVideoEnd());
    v2.addEventListener('ended', () => handleVideoEnd());

    function handleVideoEnd() {
        playNextRandomVideo(currentMode);
    }

    // ASMR 팝업창 열기 함수 (내부에 직접 오디오 태그와 소스를 포함)
    function openAsmrPopup() {
        const popupWidth = 450;
        const popupHeight = 540;
        const left = (window.innerWidth - popupWidth) / 2 + window.screenX;
        const top = (window.innerHeight - popupHeight) / 2 + window.screenY;

        asmrWindow = window.open('', 'ASMRPlayer', `width=${popupWidth},height=${popupHeight},left=${left},top=${top},resizable=yes,scrollbars=yes`);
        
        asmrWindow.document.write(`
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>ASMR 플레이어</title>
                <style>
                    body {
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        background-color: #0d1117;
                        color: #ffffff;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        height: 100vh;
                        margin: 0;
                        padding: 20px;
                        text-align: center;
                    }
                    h2 { color: rgb(255, 0, 255); margin-bottom: 8px; }
                    #statusMsg { color: #2ea043; font-size: 12px; margin-bottom: 15px; font-weight: bold; }
                    .asmr-box {
                        background: #161b22;
                        border: 1px solid #30363d;
                        padding: 20px;
                        border-radius: 12px;
                        width: 100%;
                        max-width: 350px;
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    }
                    button {
                        background: #21262d;
                        color: #c9d1d9;
                        border: 1px solid #30363d;
                        padding: 12px;
                        border-radius: 8px;
                        font-weight: bold;
                        font-size: 13px;
                        cursor: pointer;
                        transition: 0.2s;
                    }
                    button:hover { background: #30363d; color: #fff; }
                    button.stop-btn { background: #da3633; color: white; border: none; margin-top: 5px; }
                    button.stop-btn:hover { background: #c5302c; }
                </style>
            </head>
            <body>
                <div class="asmr-box">
                    <h2>🎧 집중 ASMR 룸</h2>
                    <div id="statusMsg">선택된 소리 없음</div>
                    
                    <!-- 팝업창 내부에 직접 존재하는 오디오 태그 (브라우저 차단 우회) -->
                    <audio id="popupAudio" loop></audio>

                    <button onclick="playAudio('https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', '비 오는 소리 🌧️')">비 오는 소리 🌧️</button>
                    <button onclick="playAudio('https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg', '카페 소음 ☕')">카페 소음 ☕</button>
                    <button onclick="playAudio('https://actions.google.com/sounds/v1/ambiences/campfire.ogg', '모닥불 소리 🪵')">모닥불 소리 🪵</button>
                    <button class="stop-btn" onclick="stopAudio()">ASMR 끄기 ⏹️</button>
                </div>

                <script>
                    const audio = document.getElementById('popupAudio');
                    const statusMsg = document.getElementById('statusMsg');

                    function playAudio(url, title) {
                        audio.src = url;
                        audio.load();
                        audio.play().then(() => {
                            statusMsg.innerText = "재생 중: " + title;
                        }).catch(e => {
                            statusMsg.innerText = "재생 실패 (브라우저 설정을 확인하세요)";
                        });
                    }

                    function stopAudio() {
                        audio.pause();
                        audio.currentTime = 0;
                        statusMsg.innerText = "ASMR이 정지되었습니다.";
                    }
                <\/script>
            </body>
            </html>
        `);
    }

    // 메인 타이머 종료 또는 정지 시 팝업창의 ASMR을 함께 멈추는 함수
    function stopMainAsmr() {
        if (asmrWindow && !asmrWindow.closed) {
            try {
                asmrWindow.stopAudio();
            } catch (e) {}
        }
    }

    function playNextRandomVideo(mode) {
        currentMode = mode;
        const playlist = (mode === 'study') ? studyVideos : breakVideos;
        const randomIndex = Math.floor(Math.random() * playlist.length);
        const selectedSrc = playlist[randomIndex];

        let currentVid = (activeVidIndex === 1) ? v1 : v2;
        let nextVid = (activeVidIndex === 1) ? v2 : v1;

        nextVid.src = selectedSrc;
        nextVid.load();
        
        nextVid.play().then(() => {
            nextVid.classList.add('active');
            currentVid.classList.remove('active');
            activeVidIndex = (activeVidIndex === 1) ? 2 : 1;
        }).catch(e => {
            console.log("자동재생 대기중:", e);
        });

        document.getElementById('sourceInfo').innerText = `난수 재생 중 (소스 ${randomIndex + 1}/${playlist.length})`;
    }

    function updateDisplay() {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('display').innerText = `${hours}:${minutes}:${seconds}`;
    }

    function setTimer(minutes, breakMode) {
        stopTimer();
        totalSeconds = minutes * 60;
        isBreakTime = breakMode;

        const badge = document.getElementById('modeBadge');
        const timerLabel = document.getElementById('timerModeLabel');

        if (isBreakTime) {
            badge.innerText = "휴식 시간 모드";
            badge.className = "mode-badge break";
            timerLabel.innerText = "휴식 시간";
            timerLabel.style.color = "#bb8009";
            playNextRandomVideo('break');
        } else {
            badge.innerText = "집중 공부 모드";
            badge.className = "mode-badge";
            timerLabel.innerText = "집중 공부 모드";
            timerLabel.style.color = "#2ea043";
            playNextRandomVideo('study');
        }
        updateDisplay();
    }

    function setCustomTimer() {
        const mins = parseInt(document.getElementById('customMinutes').value);
        if (isNaN(mins) || mins <= 0) {
            alert("올바른 분(Minute)을 입력하세요.");
            return;
        }
        setTimer(mins, false);
    }

    function startTimer() {
        if (timerInterval || totalSeconds <= 0) return;
        
        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();

                if (!isBreakTime) {
                    accumulatedStudySeconds++;
                    updateCharacterProgress();
                }
            } else {
                stopTimer();
                stopMainAsmr(); // 타이머 종료 시 ASMR 자동 종료
                alert(isBreakTime ? "휴식 시간이 종료되었습니다!" : "공부 시간이 종료되었습니다! 수고하셨습니다.");
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        stopMainAsmr(); // 정지/초기화 시 ASMR 자동 종료
    }

    function updateCharacterProgress() {
        const totalMinutes = Math.floor(accumulatedStudySeconds / 60);
        document.getElementById('totalStudyText').innerText = `누적 공부: ${totalMinutes}분`;

        const progressPercent = Math.min((totalMinutes % 60) / 60 * 100, 100);
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        let level = Math.floor(totalMinutes / 60) + 1;
        document.getElementById('levelText').innerText = `성장 단계: Lv.${level} 수련생`;
    }
</script>

</body>
</html>

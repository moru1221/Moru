<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 열심히 공부</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .main-container {
            display: flex;
            background: #161b22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            gap: 20px;
            width: 100%;
            max-width: 850px;
            border: 1px solid #30363d;
        }
        .left-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            position: relative;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .mode-badge {
            background: #2ea043;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .mode-badge.break {
            background: #bb8009;
        }
        .sub-text {
            color: #8b949e;
            font-size: 11px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        video.active {
            opacity: 1;
        }
        .status-card {
            background: #21262d;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .status-quote {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            background: #30363d;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: #2ea043;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #c9d1d9;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .panel-title h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f0f6fc;
        }
        .panel-title p {
            color: #8b949e;
            font-size: 12px;
        }
        .asmr-btn {
            background-color: rgb(255, 0, 255);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 0, 255, 0.4);
            transition: opacity 0.2s;
        }
        .asmr-btn:hover {
            opacity: 0.85;
        }
        .timer-card {
            background: #21262d;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid #30363d;
            margin: 15px 0;
        }
        .timer-mode-label {
            color: #2ea043;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        #display {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .timer-sub {
            color: #8b949e;
            font-size: 11px;
        }
        .preset-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .preset-buttons button {
            flex: 1;
            padding: 8px 0;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-buttons button:hover {
            background: #30363d;
            color: #fff;
        }
        .break-preset {
            color: #bb8009 !important;
        }
        .custom-input-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .custom-input-row {
            display: flex;
            gap: 6px;
        }
        .custom-input-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            color: white;
            font-size: 13px;
            text-align: center;
            outline: none;
        }
        .custom-input-row button {
            padding: 0 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkbox-label {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding-left: 2px;
        }
        .checkbox-label input {
            accent-color: #bb8009;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-start {
            background: #2ea043;
            color: white;
        }
        .btn-stop {
            background: #da3633;
            color: white;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            .video-box {
                height: 200px;
            }
            #display {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <div class="video-card">
            <div class="video-header">
                <span id="modeBadge" class="mode-badge">집중 공부 모드</span>
                <span id="sourceInfo" class="sub-text">재생 중</span>
            </div>
            <div class="video-box">
                <video id="vid1" autoplay muted playsinline class="active"></video>
                <video id="vid2" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="status-card">
            <div class="status-quote">"열심히 집중하면 캐릭터가 성장해요!"</div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="status-footer">
                <span id="totalStudyText">누적 공부: 0분</span>
                <span id="levelText">성장 단계: Lv.1 연습생</span>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div>
            <div class="panel-top-header">
                <div class="panel-title">
                    <h2>오늘도 열심히 공부</h2>
                    <p>타이머를 설정하고 캐릭터와 함께 공부하세요.</p>
                </div>
                <button class="asmr-btn" onclick="openAsmrPopup()">ASMR</button>
            </div>

            <div class="timer-card">
                <div id="timerModeLabel" class="timer-mode-label">집중 공부 모드</div>
                <div id="display">00:30:00</div>
                <div class="timer-sub">목표 시간을 향해 달려보세요!</div>
            </div>

            <div class="preset-buttons">
                <button onclick="setTimer(30, false)">30분 집중</button>
                <button onclick="setTimer(60, false)">1시간 집중</button>
                <button class="break-preset" onclick="setTimer(10, true)">10분 휴식</button>
            </div>

            <div class="custom-input-box">
                <div class="custom-input-row">
                    <input type="number" id="customMinutes" placeholder="직접 입력 (분)" min="1">
                    <button onclick="setCustomTimer()">설정</button>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="breakModeCheckbox"> 휴식 시간으로 설정하기
                </label>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-start" onclick="startTimer()">타이머 시작</button>
            <button class="btn-stop" onclick="stopTimer()">정지 / 초기화</button>
        </div>
    </div>
</div>

<script>
    const studyVideos = ['study_1.mp4', 'study_2.mp4'];
    
    let totalSeconds = 30 * 60;
    let initialTotalSeconds = 30 * 60; // 총 설정 시간 기록용
    let timerInterval = null;
    let isBreakTime = false;
    let currentMode = 'study';
    let accumulatedStudySeconds = 0;

    // 휴식 모드 영상 제어를 위한 상태 변수 (0: 시작 전, 1: study_3 재생 중, 2: study_4 반복 재생 중, 3: study_5 2초 남음 전환 완료)
    let breakVideoStage = 0;

    let activeVidIndex = 1;
    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');

    let asmrWindow = null;

    window.onload = () => {
        playRandomStudyVideo();
        updateDisplay();
    };

    v1.addEventListener('ended', () => handleVideoEnd());
    v2.addEventListener('ended', () => handleVideoEnd());

    function handleVideoEnd() {
        if (!isBreakTime) {
            playRandomStudyVideo();
        } else {
            // 휴식 모드 영상 제어 로직
            if (breakVideoStage === 1) {
                // study_3이 끝나면 -> study_4로 넘어가서 반복 재생 시작
                breakVideoStage = 2;
                playSpecificVideo('study_4.mp4', true); // true는 loop 설정
            } else if (breakVideoStage === 2) {
                // study_4가 혹시 끝나더라도 계속 study_4 반복
                playSpecificVideo('study_4.mp4', true);
            } else if (breakVideoStage === 3) {
                // study_5가 끝나면 study_5 반복 유지
                playSpecificVideo('study_5.mp4', true);
            }
        }
    }

    // 집중 모드일 때 study_1, study_2 중 랜덤 재생
    function playRandomStudyVideo() {
        const randomIndex = Math.floor(Math.random() * studyVideos.length);
        playSpecificVideo(studyVideos[randomIndex], false);
        document.getElementById('sourceInfo').innerText = `집중 영상 ${randomIndex + 1}`;
    }

    // 특정 영상 재생 함수 (루프 여부 지정 가능)
    function playSpecificVideo(filename, isLoop) {
        let currentVid = (activeVidIndex === 1) ? v1 : v2;
        let nextVid = (activeVidIndex === 1) ? v2 : v1;

        nextVid.loop = isLoop;
        nextVid.src = filename;
        nextVid.load();
        
        nextVid.play().then(() => {
            nextVid.classList.add('active');
            currentVid.classList.remove('active');
            activeVidIndex = (activeVidIndex === 1) ? 2 : 1;
        }).catch(e => {
            console.log("자동재생 대기중:", e);
        });
    }

    function updateDisplay() {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('display').innerText = `${hours}:${minutes}:${seconds}`;
    }

    function setTimer(minutes, breakMode) {
        stopTimer();
        totalSeconds = minutes * 60;
        initialTotalSeconds = totalSeconds;
        isBreakTime = breakMode;
        breakVideoStage = 0;

        const badge = document.getElementById('modeBadge');
        const timerLabel = document.getElementById('timerModeLabel');

        if (isBreakTime) {
            badge.innerText = "휴식 시간 모드";
            badge.className = "mode-badge break";
            timerLabel.innerText = "휴식 시간";
            timerLabel.style.color = "#bb8009";
            
            // 휴식 시작 시: study_3 재생 예약 (타이머 시작할 때 혹은 지금 바로)
            breakVideoStage = 1;
            playSpecificVideo('study_3.mp4', false);
            document.getElementById('sourceInfo').innerText = "휴식 영상 (시작)";
        } else {
            badge.innerText = "집중 공부 모드";
            badge.className = "mode-badge";
            timerLabel.innerText = "집중 공부 모드";
            timerLabel.style.color = "#2ea043";
            playRandomStudyVideo();
        }
        updateDisplay();
    }

    function setCustomTimer() {
        const mins = parseInt(document.getElementById('customMinutes').value);
        if (isNaN(mins) || mins <= 0) {
            alert("올바른 분(Minute)을 입력하세요.");
            return;
        }
        const isBreakChecked = document.getElementById('breakModeCheckbox').checked;
        setTimer(mins, isBreakChecked);
    }

    function startTimer() {
        if (timerInterval || totalSeconds <= 0) return;
        
        // 만약 휴식 모드인데 아직 영상을 안 틀었거나 정지 상태였다면 stage 확인
        if (isBreakTime && breakVideoStage === 0) {
            breakVideoStage = 1;
            playSpecificVideo('study_3.mp4', false);
        }

        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();

                // 휴식 모드일 때 남은 시간이 정확히 2초 남았을 때 study_5로 전환
                if (isBreakTime && totalSeconds === 2 && breakVideoStage < 3) {
                    breakVideoStage = 3;
                    playSpecificVideo('study_5.mp4', false);
                    document.getElementById('sourceInfo').innerText = "휴식 임박 (2초 전)";
                }

                if (!isBreakTime) {
                    accumulatedStudySeconds++;
                    updateCharacterProgress();
                }
            } else {
                stopTimer();
                stopMainAsmr();
                alert(isBreakTime ? "휴식 시간이 종료되었습니다!" : "공부 시간이 종료되었습니다! 수고하셨습니다.");
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        stopMainAsmr();
    }

    function updateCharacterProgress() {
        const totalMinutes = Math.floor(accumulatedStudySeconds / 60);
        document.getElementById('totalStudyText').innerText = `누적 공부: ${totalMinutes}분`;

        const progressPercent = Math.min((totalMinutes % 60) / 60 * 100, 100);
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        let level = Math.floor(totalMinutes / 60) + 1;
        document.getElementById('levelText').innerText = `성장 단계: Lv.${level} 수련생`;
    }

    // 모바일 최적화 ASMR 팝업창 함수
    function openAsmrPopup() {
        const popupWidth = 500;
        const popupHeight = 780;
        const left = (window.innerWidth - popupWidth) / 2 + window.screenX;
        const top = (window.innerHeight - popupHeight) / 2 + window.screenY;

        asmrWindow = window.open('', 'ASMRMixer', `width=${popupWidth},height=${popupHeight},left=${left},top=${top},resizable=yes,scrollbars=yes`);
        
        asmrWindow.document.write(`
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>ASMR 사운드 믹서</title>
                <style>
                    * { box-sizing: border-box; }
                    body {
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        background-color: #0d1117;
                        color: #ffffff;
                        margin: 0;
                        padding: 20px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        min-height: 100vh;
                    }
                    h2 { color: rgb(255, 0, 255); margin-bottom: 6px; font-size: 22px; text-align: center; }
                    p { color: #8b949e; font-size: 13px; margin-bottom: 20px; text-align: center; }
                    .mixer-container {
                        background: #161b22;
                        border: 1px solid #30363d;
                        padding: 18px;
                        border-radius: 16px;
                        width: 100%;
                        max-width: 440px;
                        display: flex;
                        flex-direction: column;
                        gap: 14px;
                    }
                    .sound-row {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        background: #21262d;
                        padding: 12px 16px;
                        border-radius: 12px;
                        border: 1px solid #30363d;
                    }
                    .sound-info {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        width: 140px;
                    }
                    .sound-info span {
                        font-size: 14px;
                        font-weight: bold;
                        color: #c9d1d9;
                    }
                    .toggle-btn {
                        background: #30363d;
                        color: #8b949e;
                        border: none;
                        padding: 8px 14px;
                        border-radius: 8px;
                        font-size: 12px;
                        font-weight: bold;
                        cursor: pointer;
                        transition: 0.2s;
                    }
                    .toggle-btn.active {
                        background: #2ea043;
                        color: white;
                    }
                    input[type=range] {
                        flex: 1;
                        margin-left: 15px;
                        height: 8px;
                        accent-color: #2ea043;
                        cursor: pointer;
                    }
                    .all-stop-btn {
                        background: #da3633;
                        color: white;
                        border: none;
                        padding: 14px;
                        border-radius: 12px;
                        font-weight: bold;
                        font-size: 15px;
                        cursor: pointer;
                        width: 100%;
                        max-width: 440px;
                        margin-top: 20px;
                        box-shadow: 0 4px 12px rgba(218, 54, 51, 0.4);
                    }
                    .all-stop-btn:hover { background: #c5302c; }
                </style>
            </head>
            <body>
                <h2>🎧 ASMR 사운드 믹서</h2>
                <p>원하는 소리를 켜고 볼륨을 조절해 나만의 조합을 만드세요.</p>

                <div class="mixer-container" id="mixerBox"></div>

                <button class="all-stop-btn" onclick="stopAllSounds()">모든 소리 끄기 ⏹️</button>

                <script>
                    const soundTracks = [
                        { id: 'birds', name: '새소리 🐦', file: 'birds.mp3' },
                        { id: 'crickets', name: '귀뚜라미 🦗', file: 'crickets.mp3' },
                        { id: 'fire', name: '모닥불 🪵', file: 'fire.mp3' },
                        { id: 'keyboard', name: '키보드 ⌨️', file: 'keyboard.mp3' },
                        { id: 'rain', name: '비 오는 소리 🌧️', file: 'rain.mp3' },
                        { id: 'singingbowl', name: '싱잉볼 🔔', file: 'singingbowl.mp3' },
                        { id: 'thunder', name: '천둥 번개 ⚡', file: 'thunder.mp3' },
                        { id: 'waves', name: '파도 소리 🌊', file: 'waves.mp3' },
                        { id: 'wind', name: '바람 소리 🌬️', file: 'wind.mp3' }
                    ];

                    const audioElements = {};
                    const mixerBox = document.getElementById('mixerBox');

                    soundTracks.forEach(track => {
                        const audio = new Audio(track.file);
                        audio.loop = true;
                        audio.volume = 0.5;
                        audioElements[track.id] = audio;

                        const row = document.createElement('div');
                        row.className = 'sound-row';
                        row.innerHTML = \`
                            <div class="sound-info">
                                <button class="toggle-btn" id="btn-\${track.id}" onclick="toggleSound('\${track.id}')">OFF</button>
                                <span>\${track.name}</span>
                            </div>
                            <input type="range" id="vol-\${track.id}" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume('\${track.id}', this.value)">
                        \`;
                        mixerBox.appendChild(row);
                    });

                    function toggleSound(id) {
                        const audio = audioElements[id];
                        const btn = document.getElementById('btn-' + id);

                        if (audio.paused) {
                            audio.play().then(() => {
                                btn.classList.add('active');
                                btn.innerText = 'ON';
                            }).catch(e => {
                                alert("음원 파일을 찾을 수 없거나 재생이 차단되었습니다.");
                            });
                        } else {
                            audio.pause();
                            btn.classList.remove('active');
                            btn.innerText = 'OFF';
                        }
                    }

                    function changeVolume(id, val) {
                        audioElements[id].volume = val;
                    }

                    function stopAllSounds() {
                        soundTracks.forEach(track => {
                            const audio = audioElements[track.id];
                            audio.pause();
                            audio.currentTime = 0;
                            const btn = document.getElementById('btn-' + track.id);
                            btn.classList.remove('active');
                            btn.innerText = 'OFF';
                        });
                    }
                <\/script>
            </body>
            </html>
        `);
    }

    function stopMainAsmr() {
        if (asmrWindow && !asmrWindow.closed) {
            try {
                asmrWindow.stopAllSounds();
            } catch (e) {}
        }
    }
</script>

</body>
</html>
